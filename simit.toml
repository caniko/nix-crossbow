[ci]
provider = "actions"
platform = "github"
runtime = "nix"
runner = "ubuntu-24.04"
publish_crates = true
with_msrv = true
with_docs = true
with_audit = true
with_deny = true
packages = ["crossbow-switch"]
publish_strategy = "members"

[release.notes]
# The changelog lives at crates/crossbow-switch/CHANGELOG.md; simit's
# changelog notes source validates a root CHANGELOG.md. Notes come from the
# commit range instead.
source = "git"

[release.github]
repo = "caniko/nix-crossbow"
target_branch = "trunk"

[release.artifacts]
runner = "ubuntu-24.04"
prebuild_binaries = true
binstall = true
system_runners = { x86_64-linux = "ubuntu-24.04" }
# SHA256SUMS.txt is minisign-signed with the committed keys/minisign.pub trust
# root; MINISIGN_SECRET_KEY and MINISIGN_PASSWORD hold the secret half.
sign = true
